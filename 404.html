<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stránka nenalezena | Lukáš Langr — Instalatérské služby</title>
<meta name="robots" content="noindex, follow"/>
<meta name="theme-color" content="#1a6fb5"/>
<link rel="canonical" href="https://instalater-nymburk.cz/"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #1a6fb5;
    --surface: #fbf9f6;
    --on-surface: #1b1c1a;
    --on-surface-variant: #414751;
    --outline-variant: #c1c7d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    background: var(--surface);
    color: var(--on-surface);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    text-align: center;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 48px;
  }
  .logo span {
    font-family: "Noto Serif", Georgia, serif;
    font-size: 30px; color: var(--primary); letter-spacing: -0.02em;
  }
  .code {
    font-family: "Noto Serif", Georgia, serif;
    font-size: clamp(88px, 20vw, 150px);
    line-height: 1;
    color: var(--primary);
    opacity: 0.16;
    margin: 0;
  }
  h1 {
    font-family: "Noto Serif", Georgia, serif;
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 400;
    margin: -12px 0 16px;
  }
  p {
    color: var(--on-surface-variant);
    font-size: 16px; line-height: 1.7;
    max-width: 460px;
    margin: 0 auto 40px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 16px 34px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  .btn-primary {
    background: var(--primary); color: #fff;
    box-shadow: 0 4px 14px rgba(26,111,181,0.25);
  }
  .btn-primary:hover { background: #15598f; box-shadow: 0 6px 20px rgba(26,111,181,0.35); }
  .btn-ghost { color: var(--on-surface-variant); border: 1px solid rgba(193,199,210,0.6); }
  .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }
  .contact {
    margin-top: 56px; padding-top: 28px;
    border-top: 1px solid rgba(193,199,210,0.4);
    font-size: 13px; color: var(--on-surface-variant);
    max-width: 460px; width: 100%;
  }
  .contact a { color: var(--primary); text-decoration: none; font-weight: 500; }
  .contact a:hover { text-decoration: underline; }

  /* === Odznak autora webu (weby-hned.cz) === */
  .author-badge {
    display: inline-flex; align-items: center; gap: 14px;
    margin-top: 32px; padding: 10px 18px;
    background: #151515;
    border: 1px solid rgba(212,160,58,0.25);
    border-radius: 8px;
    text-decoration: none;
    transition: transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s ease, border-color .35s ease;
  }
  .author-badge__label {
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    font-weight: 700; color: rgba(255,255,255,.45); white-space: nowrap;
    transition: color .35s ease;
  }
  .author-badge__logo {
    height: 26px; width: auto; display: block;
    transition: transform .35s cubic-bezier(.34,1.4,.64,1);
  }
  .author-badge:hover, .author-badge:focus-visible {
    border-color: #d4a03a;
    transform: translateY(-4px);
    box-shadow: 0 0 0 4px rgba(212,160,58,.22), 0 14px 32px rgba(17,17,17,.32);
    outline: none;
  }
  .author-badge:hover .author-badge__label,
  .author-badge:focus-visible .author-badge__label { color: #d4a03a; }
  .author-badge:hover .author-badge__logo,
  .author-badge:focus-visible .author-badge__logo { transform: scale(1.04); }
  .author-badge:active { transform: translateY(-1px); }

  @media (prefers-reduced-motion: reduce) {
    .author-badge, .author-badge__logo, .author-badge__label { transition: none; }
    .author-badge:hover { transform: none; }
  }
</style>
</head>
<body>

  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="color:#1a6fb5">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 0.8c-0.5 1.3-2.5 3.6-2.5 5.4a2.5 2.5 0 0 0 5 0c0-1.8-2-4.1-2.5-5.4z" fill="currentColor"/>
    </svg>
    <span>LANGR</span>
  </div>

  <p class="code">404</p>
  <h1>Tady nic neteče</h1>
  <p>Stránka, kterou hledáte, neexistuje nebo byla přesunuta. Zkuste se vrátit na úvod nebo si prohlédnout moje realizace.</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">Zpět na úvod</a>
    <a class="btn btn-ghost" href="/galerie.html">Moje práce</a>
  </div>

  <div class="contact">
    Potřebujete instalatéra hned?<br/>
    <a href="tel:+420732964228">+420 732 964 228</a> · <a href="mailto:lukaslangr11@seznam.cz">lukaslangr11@seznam.cz</a>
  </div>

  <a class="author-badge" href="https://weby-hned.cz" target="_blank" rel="noopener noreferrer" aria-label="Web vytvořil weby-hned.cz — tvorba webů a správa e-shopů (otevře se v novém okně)">
    <span class="author-badge__label">Web vytvořil</span>
    <img class="author-badge__logo" src="/img/logo-weby-hned.svg" alt="weby-hned.cz — tvorba webů a správa e-shopů" width="148" height="26"/>
  </a>

</body>
</html>
